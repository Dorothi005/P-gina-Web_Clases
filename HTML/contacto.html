<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/contacto.css">
    <title>Contacto</title>
    <h2>Formulario de Inscripción</h2>
    <p class="h5">Complete los siguientes campos para postularse</p>
</head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://www.ulagos.cl/wp-content/uploads/2019/11/ulagos-01.png">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Datos personales</label>
  <h6>Nombre</h6>
  <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su nombre completo">
  <h6>Correo electrónico</h6>
  <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su correo electrónico">
  <h6>Teléfono</h6>
  <input type="tel" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su número de teléfono">
  <h6>Región</h6>
  <select class="form-select" aria-label="Default select example">
  <option selected>Seleccione una región</option>
  <option value="1">Región 1</option>
  <option value="2">Región 2</option>
  <option value="3">Región 3</option>
</select>
</div>
<div class="mb-3">
  <label for="exampleFormControlTextarea1" class="form-label">Mensaje</label>
  <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
  <a href="#" class="btn btn-primary disabled" tabindex="-1" role="button" aria-disabled="true">Primary link</a>
<a href="#" class="btn btn-secondary disabled" tabindex="-1" role="button" aria-disabled="true">Link</a>
</div>

</body>
</html>
