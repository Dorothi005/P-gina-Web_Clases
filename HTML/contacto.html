<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/contacto.css">
    <title>Contacto</title>
    <h2>Formulario de Inscripción</h2>
    <p class="h5">Complete los siguientes campos para postularse</p>
</head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://www.ulagos.cl/wp-content/uploads/2019/11/ulagos-01.png">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Datos personales</label>
  <h6>Nombre</h6>
  <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su nombre completo">
  
  <h6>Correo electrónico</h6>
  <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su correo electrónico">
  
  <h6>Teléfono</h6>
  <input type="tel" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su número de teléfono">
  
  <h6>Fecha de nacimiento</h6>
  <input type="date" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su fecha de nacimiento">

  <h6>Región</h6>
  <select class="form-select" aria-label="Default select example">
  <option selected>Seleccione una región</option>
  <option value="1">La araucanía</option>
  <option value="2">Los Ríos</option>
  <option value="3">Los Lagos</option>

</select>
</div>
<h5>Datos académicos</h5>
<div class="mb-3">
  <div class="form-check">
  <input class="form-check-input" type="radio" name="Enseñanza Media" id="Enseñanza Media">
  <label class="form-check-label" for="Enseñanza Media">
  Enseñanza Media
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="Técnico" id="Técnico" checked>
  <label class="form-check-label" for="Técnico">
  Técnico 
  </label>
  <div class="form-check">
  <input class="form-check-input" type="radio" name="Universidad" id="Universidad">
  <label class="form-check-label" for="Universidad">
  Universitario
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="Técnico" id="Técnico">
  <label class="form-check-label" for="Técnico">
    Otro
  </label>
</div>

<label for="exampleFormControlInput1" class="form-label">Carrera</label>
  <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su carrera">
  
  <h6>Universidad</h6>
  <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su universidad">
  
  <h6>Año de ingreso</h6>
  <input type="number" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su año de ingreso">
  
  <h6>Año de egreso</h6>
  <input type="number" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su año de egreso">
  
  <h6>Promedio ponderado</h6>
  <input type="number" class="form-control" id="exampleFormControlInput1" placeholder="Ingrese su promedio ponderado">

</body>
</html>
